<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Defend Sacred Ground</title>
<link rel="icon" type="image/png" href="/assets/logo-square.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Self-contained on purpose: this page answers at any depth and must not
     depend on the app bundle. Absolute asset paths only. */
  body { margin:0; background:#FAF6EF; color:#1B1917; font-family:'Public Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:#9E1B24; color:#FAF6EF; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .serif { font-family:'Libre Caslon Display',serif; font-weight:400; }
  .wrap { max-width:1280px; margin:0 auto; padding-left:28px; padding-right:28px; box-sizing:border-box; }
  .bar { background:#152340; color:#E6DFD2; }
  .bar-inner { padding-top:18px; padding-bottom:18px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .bar-label { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#B08D57; flex:none; }
  .bar-path { font-size:13px; color:#9CA9C1; word-break:break-all; flex:1; min-width:200px; }
  .bar-btn { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#FAF6EF; background:transparent; border:1px solid #B08D57; padding:11px 18px; cursor:pointer; flex:none; font-family:'Public Sans',system-ui,sans-serif; }
  .bar-btn[disabled] { color:#8FA0C0; border-color:rgba(143,160,192,.4); cursor:default; }
  .hero { position:relative; background:#0F1B33; overflow:hidden; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 45%; opacity:.3; filter:grayscale(1); }
  .hero .scrim { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,18,34,.94) 0%,rgba(10,18,34,.5) 100%); }
  .hero-inner { position:relative; max-width:820px; margin:0 auto; padding:88px 28px 56px; box-sizing:border-box; }
  .big404 { font-size:96px; color:rgba(250,246,239,.35); line-height:1; }
  .hero h1 { font-size:46px; line-height:1.08; color:#FAF6EF; margin:16px 0 0; font-weight:400; }
  .main { max-width:820px; margin:0 auto; padding:48px 28px 100px; box-sizing:border-box; }
  .main p { font-size:18px; line-height:1.65; color:#413B33; margin:0 0 36px; }
  .actions { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .cta { display:inline-block; font-size:15px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#FAF6EF; background:#9E1B24; border:none; padding:18px 30px; cursor:pointer; white-space:normal; line-height:1.25; max-width:100%; text-decoration:none; text-align:center; transition:background .18s; }
  .cta:hover { background:#6E1219; }
  .countline { font-size:14px; color:#5A5248; }
  .stay { font-size:14px; color:#1F3157; background:none; border:none; border-bottom:1px solid #B08D57; padding:4px 0; cursor:pointer; font-family:'Public Sans',system-ui,sans-serif; }
  .stay:hover { color:#9E1B24; border-bottom-color:#9E1B24; }
  @media (max-width:768px){ .hero h1 { font-size:36px; } .big404 { font-size:72px; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="wrap bar-inner">
      <span class="mono bar-label">This link is broken</span>
      <span class="mono bar-path" id="failed-path"></span>
      <button class="bar-btn" id="report-btn" type="button">Let us know</button>
    </div>
  </div>
  <div class="hero">
    <img src="/assets/ww1-troops.jpg" alt="">
    <div class="scrim"></div>
    <div class="hero-inner">
      <div class="serif big404">404</div>
      <h1 class="serif">Page not found</h1>
    </div>
  </div>
  <div class="main">
    <p>That page has moved or never existed. The campaign has not.</p>
    <div class="actions">
      <a class="cta" href="/take-action/defend-sacred-ground">Go to the petition</a>
      <span class="countline" id="count-line"></span>
      <button class="stay" id="stay-btn" type="button" hidden>Stay here</button>
    </div>
  </div>
<script>
(function () {
  var DEST = "/take-action/defend-sacred-ground";
  // Failed path rendered as a TEXT NODE — never innerHTML (attacker-controlled).
  var failed = location.pathname + location.search;
  document.getElementById("failed-path").appendChild(document.createTextNode(failed));

  // Broken-link report
  var btn = document.getElementById("report-btn");
  btn.addEventListener("click", function () {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "Sending…";
    fetch("/api/report-broken-link", {
      method: "POST", keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: failed.slice(0, 500), referrer: (document.referrer || "").slice(0, 500) })
    }).then(function (r) {
      if (!r.ok) throw new Error();
      btn.textContent = "Thanks, reported";
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "That didn't send. Please try again.";
    });
  });

  // 15 s auto-forward via location.replace (the dead URL never enters history).
  // Any interaction cancels it permanently: a page can't both redirect and host a button.
  var remaining = 15, cancelled = false, timer = null;
  var line = document.getElementById("count-line");
  var stay = document.getElementById("stay-btn");
  stay.hidden = false;
  function render() { line.textContent = "Taking you there in " + remaining + " seconds."; }
  function cancel() {
    if (cancelled) return;
    cancelled = true;
    clearInterval(timer);
    line.textContent = "Auto-forward cancelled.";
    stay.hidden = true;
    ["pointerdown", "keydown", "wheel", "touchstart", "scroll"].forEach(function (e) {
      window.removeEventListener(e, cancel);
    });
  }
  ["pointerdown", "keydown", "wheel", "touchstart", "scroll"].forEach(function (e) {
    window.addEventListener(e, cancel, { passive: true });
  });
  stay.addEventListener("click", cancel);
  render();
  timer = setInterval(function () {
    if (cancelled) return;
    remaining -= 1;
    if (remaining <= 0) { clearInterval(timer); location.replace(DEST); return; }
    render();
  }, 1000);
})();
</script>
</body>
</html>
